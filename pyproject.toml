[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mgtwin"
version = "0.6.11"
description = "Staged, gated authoring of microgrid digital twins"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0", "numpy>=1.24", "scipy>=1.10", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
banshee = ["pandapower>=3.0", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
include = ["mgtwin*"]

[tool.setuptools.package-data]
mgtwin = ["specs/*.yaml"]
